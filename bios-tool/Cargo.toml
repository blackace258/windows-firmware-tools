[package]
name = "bios-tool"
version = "0.2.0"
edition = "2021"
description = "Windows-native CLI + professional GUI for SPI BIOS extraction, firmware inspection, verification, and controlled programming"
authors = ["AI Agent"]
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
log = "0.4"

# Optional professional GUI (Windows-native look via egui)
eframe = { version = "0.27", optional = true, default-features = true }
egui = { version = "0.27", optional = true }
rfd = { version = "0.14", optional = true }

[features]
default = []
gui = ["eframe", "egui", "rfd"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"

[[bin]]
name = "bios-tool"
path = "src/main.rs"

[[bin]]
name = "bios-tool-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]
