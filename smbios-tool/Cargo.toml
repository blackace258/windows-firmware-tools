[package]
name = "smbios-tool"
version = "0.1.0"
edition = "2021"
description = "Windows SMBIOS/DMI reader plus a fail-closed, vendor-tool write gate"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Windows API for GetSystemFirmwareTable
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_SystemInformation",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "smbios-tool"
path = "src/main.rs"
